[package]
name = "terminal_ai"
version = "0.1.0"
edition = "2021"
authors = ["Claus <claus@terminal_ai.local>"]
description = "Utilitário CLI Linux que traduz comandos em linguagem natural usando IA"

[[bin]]
name = "tai"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "2.1"
inquire = "0.7"
indicatif = "0.17"
arboard = "3.4"
directories = "5.0"
thiserror = "1.0"
async-trait = "0.1"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.12"
